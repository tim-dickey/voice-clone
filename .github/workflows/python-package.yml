# CI workflow: lint and test with lightweight dev dependencies only
# Heavy ML/UI packages (torch, PyQt6, TTS) are not installed in CI
name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install CI dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest pytest-cov black pylint mypy
        pip install pydantic>=2.5.0 pydantic-settings>=2.1.0
        pip install requests>=2.31.0 python-dotenv>=1.0.0
        pip install click>=8.1.7 tqdm>=4.66.1
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest tests/ -v --ignore=tests/test_voice_modules.py || true
